# Whether e2e/quality.js is still savoir-faire's latest quality gate (practice quality-gate).
# Allowed to fail: it only says to run `npm run gate:update`, then `npm run test:e2e`.
name: gate

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: npm run gate:check

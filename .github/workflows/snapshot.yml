# Rebuilds the AppView snapshot (records + open jobs) every 6 hours and
# publishes it to the public repo joblisttoday/joblist-snapshot (GitHub Pages),
# which the app reads. Free, and needs no Cloudflare credentials.
# Secrets: SNAPSHOT_DEPLOY_KEY (write deploy key of joblist-snapshot);
# optional BOT_HANDLE and BOT_APP_PASSWORD: the account that posts the week's trends (bot/);
# optional SITE_DEPLOY_HOOK: the Worker's deploy hook (Workers & Pages > the Worker > Settings >
# Builds > Deploy Hooks, branch main), so its prerendered pages follow each snapshot.
# The site itself (prerendered pages) is built and deployed by Cloudflare Workers Builds on push,
# and after each snapshot when SITE_DEPLOY_HOOK is set.
# Also publishes the last crawl (branch `crawl`) under crawl/.
#
# Two jobs: `build` runs the dependencies and the indexer with no secret and a
# read-only token, and hands the snapshot over as an artifact; `publish` holds
# the deploy key and only pushes those files (no npm, no code from the repo).
name: snapshot

# On its schedule only, never on a push: each run reads every job board again, and code
# changes do not change the jobs. To see an indexer change sooner: `gh workflow run snapshot`.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: snapshot
  # A run in progress finishes (it may be looking up places for half an hour); the next one waits.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # No install scripts: the indexer needs none (only esbuild, workerd and core-js have any, for the site build and wrangler).
      - run: npm ci --ignore-scripts
      - name: Restore the last crawl (health and proposals, see docs/crawler.md)
        id: crawl
        continue-on-error: true # no crawl yet
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: crawl
          path: static/snapshot/crawl
          persist-credentials: false
      - run: rm -rf static/snapshot/crawl/.git
      - run: node indexer/index.js static/snapshot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot
          path: static/snapshot
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: snapshot
          path: snapshot
      - name: Publish to joblisttoday/joblist-snapshot (one commit, no history)
        env:
          DEPLOY_KEY: ${{ secrets.SNAPSHOT_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$DEPLOY_KEY" > ~/.ssh/snapshot && chmod 600 ~/.ssh/snapshot
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          cd snapshot
          printf '# joblist snapshot\n\nRebuilt %s by joblist-atproto. Records belong to their authors.\n' "$(date -u +%FT%TZ)" > README.md
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name=joblist -c user.email=1502484+4www@users.noreply.github.com commit -qm "Snapshot $(date -u +%FT%TZ)"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/snapshot" git push -qf git@github.com:joblisttoday/joblist-snapshot.git gh-pages

  # The week's trends on Bluesky (bot/index.js), at most once a week: counts, never a
  # mention. A dry run until the BOT_* secrets are set. No npm: the bot uses fetch only.
  announce:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: snapshot
          path: snapshot
      - name: Post the week's trends
        env:
          BOT_HANDLE: ${{ secrets.BOT_HANDLE }}
          BOT_APP_PASSWORD: ${{ secrets.BOT_APP_PASSWORD }}
        run: |
          if [ -n "$BOT_HANDLE" ] && [ -n "$BOT_APP_PASSWORD" ]; then node bot/index.js snapshot --write; else node bot/index.js snapshot; fi

  # The site's prerendered pages (companies, jobs, sitemap) from this snapshot, not the one of
  # the last push. The build downloads the snapshot as GitHub serves it, cached for minutes:
  # first wait until it serves this one (a check every 30 s, 10 minutes at most). Skipped
  # without SITE_DEPLOY_HOOK. No npm, no code from the repo: only the hook's URL, a secret.
  rebuild:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: snapshot
          path: snapshot
      - name: Build the site again
        env:
          SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
          SNAPSHOT_URL: https://raw.githubusercontent.com/joblisttoday/joblist-snapshot/gh-pages/meta.json
        run: |
          if [ -z "$SITE_DEPLOY_HOOK" ]; then echo "No SITE_DEPLOY_HOOK: the site is built on the next push."; exit 0; fi
          want=$(jq -r .generatedAt snapshot/meta.json)
          for i in $(seq 1 20); do
            served=$(curl -fsS "$SNAPSHOT_URL" | jq -r .generatedAt || true)
            [ "$served" = "$want" ] && break
            sleep 30
          done
          if [ "$served" != "$want" ]; then echo "GitHub still serves $served, not $want: the next snapshot will build the site."; exit 0; fi
          curl -fsS -X POST "$SITE_DEPLOY_HOOK" -o /dev/null
          echo "Site build asked for snapshot $want."

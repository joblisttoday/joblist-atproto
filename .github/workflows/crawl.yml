# The joblist crawler (docs/crawler.md): weekly health check, repairs and new
# companies, written from the crawler's own atproto account, then a fresh snapshot.
# Free: runs on GitHub Actions. Without the CRAWLER_* secrets it is a dry run
# that still publishes the health report.
# Secrets: CRAWLER_HANDLE, CRAWLER_APP_PASSWORD (and optionally CRAWLER_SERVICE).
name: crawl

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      write:
        description: Write the crawler's versions (needs the CRAWLER_* secrets)
        type: boolean
        default: true

concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: write # keep each crawl's report on the `crawl` branch
  actions: write # start the snapshot workflow

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test the crawler's rules
        run: node --test 'scripts/**/*.test.js'
      - name: Crawl
        env:
          CRAWLER_HANDLE: ${{ secrets.CRAWLER_HANDLE }}
          CRAWLER_APP_PASSWORD: ${{ secrets.CRAWLER_APP_PASSWORD }}
          CRAWLER_SERVICE: ${{ secrets.CRAWLER_SERVICE }}
          WRITE: ${{ github.event_name == 'schedule' || inputs.write }}
        run: |
          if [ "$WRITE" = "true" ] && [ -n "$CRAWLER_APP_PASSWORD" ]; then
            node scripts/crawl.js --write
          else
            node scripts/crawl.js
          fi
      - name: Keep the report on the crawl branch
        run: |
          git config user.name 'joblist crawler'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch --depth=1 origin crawl; then
            git worktree add ../crawl-branch FETCH_HEAD
            git -C ../crawl-branch switch -c crawl
          else
            git worktree add --orphan -b crawl ../crawl-branch
          fi
          cp static/snapshot/crawl/*.json ../crawl-branch/
          git -C ../crawl-branch add -A
          git -C ../crawl-branch commit -qm "Crawl of $(date -u +%F)" || echo 'nothing changed'
          git -C ../crawl-branch push origin crawl
      - name: Rebuild the snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run snapshot.yml --ref ${{ github.event.repository.default_branch }}
